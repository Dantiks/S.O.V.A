name: sova
description: S.O.V.A - AI-powered financial assistant for Kyrgyzstan banks
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Functional Programming
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.13.6
  firebase_analytics: ^10.7.4
  # firebase_messaging: ^14.7.9
  # firebase_crashlytics: ^3.4.9
  # flutter_local_notifications: ^16.3.0
  
  # Security
  local_auth: ^2.1.8
  flutter_screen_lock: ^9.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # AI & ML
  # google_generative_ai: ^0.2.1
  chat_gpt_sdk: ^2.2.5
  # speech_to_text: ^6.5.1
  # flutter_tts: ^4.0.2
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  rive: ^0.12.4
  fl_chart: ^0.66.0
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  logger: ^2.0.2+1
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  url_launcher: ^6.2.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.1
  connectivity_plus: ^5.0.2
  
  # Home Screen Widgets
  home_widget: ^0.4.1
  
  # PDF/CSV Import & Export
  # file_picker: ^6.1.1
  csv: ^6.0.0
  # pdf: ^3.10.7
  # printing: ^5.11.1
  
  # OCR
  # google_mlkit_text_recognition: ^0.11.0
  # image_picker: ^1.0.7
  
  # Icons
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.13.1
  
  # Monitoring
  # sentry_flutter: ^7.14.0
  
  # Performance
  # flutter_native_splash: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1
  
  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
    - assets/lottie/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
